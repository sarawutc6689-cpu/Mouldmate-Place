<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่ระบบ | ระบบแจ้งซ่อมอาคารและสถานที่</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Sarabun', 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%);
    color:#1e293b; display:flex; justify-content:center; align-items:center;
    min-height:100vh; flex-direction:column;
  }
  .card {
    background:#fff; border-radius:16px; padding:34px 30px;
    box-shadow:0 8px 30px rgba(15,118,110,.12);
    border:1px solid #e0f2f1;
    width:380px; margin-bottom:20px;
  }
  .card h2 {
    margin-bottom:22px; font-size:20px; color:#0f766e;
    text-align:center; font-weight:700;
  }
  .logo-box {
    width:64px; height:64px; margin:0 auto 14px;
    background:linear-gradient(135deg,#14b8a6,#0f766e);
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:30px; box-shadow:0 6px 16px rgba(20,184,166,.35);
  }
  .form-group { margin-bottom:16px; }
  .form-group label {
    display:block; margin-bottom:6px; font-weight:600;
    font-size:13.5px; color:#334155;
  }
  .form-group input {
    width:100%; padding:11px 13px; border:1px solid #cbd5e1;
    border-radius:10px; font-size:14px; transition:all .2s;
    background:#f8fafc;
  }
  .form-group input:focus {
    outline:none; border-color:#14b8a6; background:#fff;
    box-shadow:0 0 0 3px rgba(20,184,166,.15);
  }
  .btn {
    padding:12px; border:none; border-radius:10px; cursor:pointer;
    font-size:14.5px; width:100%; font-weight:700;
    background:linear-gradient(135deg,#14b8a6,#0f766e);
    color:#fff; transition:all .2s; letter-spacing:.3px;
  }
  .btn:hover {
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(20,184,166,.35);
  }
  .app-footer { font-size:13px; color:#94a3b8; text-align:center; }
  .back-link {
    display:inline-block; margin-top:16px; font-size:13px;
    color:#0f766e; text-decoration:none; font-weight:600;
  }
  .back-link:hover { text-decoration:underline; }
  #errorMsg { color:#dc2626; margin-top:10px; font-size:13px; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-box">🛠️</div>
    <h2>เข้าสู่ระบบจัดการ</h2>
    <form id="loginForm">
      <div class="form-group"><label>อีเมล</label><input type="email" id="email" required></div>
      <div class="form-group"><label>รหัสผ่าน</label><input type="password" id="password" required></div>
      <button type="submit" class="btn">เข้าสู่ระบบ</button>
      <p id="errorMsg"></p>
    </form>
    <div style="text-align:center;">
      <a href="request.html" class="back-link">← กลับไปหน้าแจ้งซ่อมทั่วไป</a>
    </div>
  </div>
  <footer class="app-footer">ระบบแจ้งซ่อมอาคารและสถานที่ | พัฒนาโดย Sarawut.C</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fuarmmweqxxhczavkvqp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YXJtbXdlcXh4aGN6YXZrdnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjgzMTcsImV4cCI6MjEwMzgwNDMxN30.n7s4gKOkCvaOSpFSf9FGmWsqi7eAzFe28c_oJWy8NSE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { document.getElementById('errorMsg').textContent = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'; return; }
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
