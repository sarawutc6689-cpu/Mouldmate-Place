<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard | ระบบแจ้งซ่อมอาคารและสถานที่</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Sarabun', sans-serif; }
  body { background:#f4f6f8; color:#1e293b; display:flex; min-height:100vh; }
  .sidebar { width:240px; background:#1e293b; color:#fff; display:flex; flex-direction:column; position:fixed; height:100vh; }
  .sidebar-header { padding:20px; border-bottom:1px solid #334155; }
  .sidebar-menu { display:flex; flex-direction:column; padding:10px 0; flex:1; }
  .sidebar-menu a { padding:12px 20px; color:#cbd5e1; text-decoration:none; font-size:15px; display:block; }
  .sidebar-menu a:hover, .sidebar-menu a.active { background:#334155; color:#fff; }
  .content { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .page-body { flex:1; padding:30px; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:20px; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:15px; margin-bottom:20px; }
  .stat-card { background:#fff; border-radius:10px; padding:20px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat-card .num { font-size:28px; font-weight:700; color:#2563eb; }
  .stat-card .label { color:#64748b; font-size:13px; margin-top:4px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { padding:10px; border-bottom:1px solid #e2e8f0; text-align:left; font-size:14px; }
  th { background:#f1f5f9; }
  .badge { padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; display:inline-block; }
  .badge-pending { background:#fef9c3; color:#854d0e; }
  .badge-approved { background:#dbeafe; color:#1e40af; }
  .badge-in_progress { background:#e0e7ff; color:#4338ca; }
  .badge-completed { background:#dcfce7; color:#166534; }
  .badge-rejected { background:#fee2e2; color:#991b1b; }
  .app-footer { text-align:center; padding:15px; font-size:13px; color:#94a3b8; border-top:1px solid #e2e8f0; background:#fff; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2>🛠️ ระบบแจ้งซ่อม</h2></div>
    <nav class="sidebar-menu">
      <a href="request.html">📋 แจ้งซ่อม / ติดตาม</a>
      <a href="dashboard.html" class="active">📊 Dashboard</a>
      <a href="approve.html">✅ อนุมัติงาน</a>
      <a href="reports.html">📈 รายงาน</a>
      <a href="locations.html">🏢 จัดการสถานที่</a>
      <a href="#" onclick="logout()">🚪 ออกจากระบบ</a>
    </nav>
  </aside>
  <div class="content">
    <div class="page-body">
      <h1>ภาพรวมระบบ</h1>
      <div class="stat-grid" style="margin-top:20px;">
        <div class="stat-card"><div class="num" id="cPending">-</div><div class="label">รอดำเนินการ</div></div>
        <div class="stat-card"><div class="num" id="cApproved">-</div><div class="label">อนุมัติแล้ว</div></div>
        <div class="stat-card"><div class="num" id="cInProgress">-</div><div class="label">กำลังซ่อม</div></div>
        <div class="stat-card"><div class="num" id="cCompleted">-</div><div class="label">เสร็จสิ้น</div></div>
        <div class="stat-card"><div class="num" id="cTotal">-</div><div class="label">ทั้งหมด</div></div>
      </div>
      <div class="card">
        <h3>10 รายการแจ้งซ่อมล่าสุด</h3>
        <table>
          <thead><tr><th>เลขที่เอกสาร</th><th>ผู้แจ้ง</th><th>รายละเอียด</th><th>สถานะ</th><th>วันที่แจ้ง</th></tr></thead>
          <tbody id="recentList"></tbody>
        </table>
      </div>
    </div>
    <footer class="app-footer">ระบบแจ้งซ่อมอาคารและสถานที่ | พัฒนาโดย Sarawut.C</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fuarmmweqxxhczavkvqp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YXJtbXdlcXh4aGN6YXZrdnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjgzMTcsImV4cCI6MjEwMzgwNDMxN30.n7s4gKOkCvaOSpFSf9FGmWsqi7eAzFe28c_oJWy8NSE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      loadDashboard();
    }
    checkAuth();

    async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }

    async function loadDashboard() {
      const statuses = [['pending', 'cPending'], ['approved', 'cApproved'], ['in_progress', 'cInProgress'], ['completed', 'cCompleted']];
      let total = 0;
      for (const [st, id] of statuses) {
        const { count } = await supabaseClient.from('repair_requests').select('*', { count: 'exact', head: true }).eq('status', st);
        document.getElementById(id).textContent = count ?? 0;
        total += count ?? 0;
      }
      document.getElementById('cTotal').textContent = total;
      const { data } = await supabaseClient.from('repair_requests').select('document_no, reporter_name, description, status, created_at').order('created_at', { ascending: false }).limit(10);
      const tbody = document.getElementById('recentList');
      tbody.innerHTML = '';
      (data || []).forEach(i => {
        tbody.innerHTML += `<tr><td>${i.document_no}</td><td>${i.reporter_name}</td><td>${i.description}</td><td><span class="badge badge-${i.status}">${i.status}</span></td><td>${new Date(i.created_at).toLocaleString('th-TH')}</td></tr>`;
      });
    }
  </script>
</body>
</html>
