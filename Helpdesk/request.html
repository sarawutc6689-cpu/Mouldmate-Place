        <!-- Main Form Content -->

                <!-- Status message box -->

                <form class="space-y-6">

                    <!-- Location Cascading Dropdowns -->

                            <input type="file" id="image_2" accept="image/*" class="w-full bg-zinc-900/50 border border-cardBorder rounded-xl px-4 py-2.5 text-sm text-zinc-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-primaryRed/20 file:text-primaryRed hover:file:bg-primaryRed/30 focus:outline-none focus:border-primaryRed transition-colors">

    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ตั้งค่าการเชื่อมต่อ Supabase
        const SUPABASE_URL = 'https://fuarmmweqxxhczavkvqp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YXJtbXdlcXh4aGN6YXZrdnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjgzMTcsImV4cCI6MjEwMzgwNDMxN30.n7s4gKOkCvaOSpFSf9FGmWsqi7eAzFe28c_oJWy8NSE'; // <-- ใส่ anon key จริงตรงนี้
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Edge Function สำหรับอัปโหลดรูปขึ้น Google Drive
        const UPLOAD_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/upload-to-drive`;
        const MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5MB

        const statusBox = document.getElementById('statusBox');
        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = 'mb-6 rounded-xl px-4 py-3 text-sm ' +
                (type === 'error'
                    ? 'bg-red-500/10 text-red-400 border border-red-500/30'
                    : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30');
        }

        const buildingSelect = document.getElementById('building_select');
        const floorSelect = document.getElementById('floor_select');
        const roomSelect = document.getElementById('room_select');

        // 1. โหลดรายการอาคารตอนเปิดหน้า
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data, error } = await supabaseClient
                    .from('buildings')
                    .select('*')
                    .order('name', { ascending: true });

                if (error) throw error;

                buildingSelect.innerHTML = '<option value="">-- เลือกอาคาร --</option>';
                (data || []).forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.name;
                    buildingSelect.appendChild(opt);
                });
            } catch (err) {
                console.error('Error loading buildings:', err.message);
                showStatus('โหลดรายการอาคารไม่สำเร็จ: ' + err.message, 'error');
            }
        });

        // 2. เมื่อเลือกอาคาร -> โหลดชั้น
        buildingSelect.addEventListener('change', async () => {
            floorSelect.innerHTML = '<option value="">-- เลือกชั้น --</option>';
            roomSelect.innerHTML = '<option value="">-- เลือกชั้นก่อน --</option>';
            floorSelect.disabled = true;
            roomSelect.disabled = true;

            const buildingId = buildingSelect.value;
            if (!buildingId) return;

            try {
                const { data, error } = await supabaseClient
                    .from('floors')
                    .select('*')
                    .eq('building_id', buildingId)
                    .order('sort_order', { ascending: true });

                if (error) throw error;

                (data || []).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = f.name;
                    floorSelect.appendChild(opt);
                });
                floorSelect.disabled = false;
            } catch (err) {
                console.error('Error loading floors:', err.message);
                showStatus('โหลดรายการชั้นไม่สำเร็จ: ' + err.message, 'error');
            }
        });

        // 3. เมื่อเลือกชั้น -> โหลดห้อง/โซน
        floorSelect.addEventListener('change', async () => {
            roomSelect.innerHTML = '<option value="">-- เลือกห้อง/โซน --</option>';
            roomSelect.disabled = true;

            const floorId = floorSelect.value;
            if (!floorId) return;

            try {
                const { data, error } = await supabaseClient
                    .from('rooms')
                    .select('*')
                    .eq('floor_id', floorId)
                    .order('name', { ascending: true });

                if (error) throw error;

                (data || []).forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.name;
                    roomSelect.appendChild(opt);
                });
                roomSelect.disabled = false;
            } catch (err) {
                console.error('Error loading rooms:', err.message);
                showStatus('โหลดรายการห้อง/โซนไม่สำเร็จ: ' + err.message, 'error');
            }
        });

        // 4. ตรวจสอบรหัสพนักงานอัตโนมัติเมื่อพิมพ์เสร็จ (emp_code) -> แยกชื่อ/แผนก/ฝ่าย
        const empInput = document.getElementById('emp_code');
        const empNameInput = document.getElementById('emp_name');
        const empDeptInput = document.getElementById('emp_department');
        const empSectionInput = document.getElementById('emp_section');

        function setEmpFieldsError(msg) {
            [empNameInput, empDeptInput, empSectionInput].forEach(el => {
                el.value = msg;
                el.classList.add('text-red-400');
                el.classList.remove('text-zinc-200');
            });
        }

        function setEmpFields(data) {
            empNameInput.value = data.name || '';
            empDeptInput.value = data.department || '';
            empSectionInput.value = data.section || '';
            [empNameInput, empDeptInput, empSectionInput].forEach(el => {
                el.classList.remove('text-red-400');
                el.classList.add('text-zinc-200');
            });
        }

        empInput.addEventListener('blur', async () => {
            const empCode = empInput.value.trim();
            if (!empCode) return;

            try {
                const { data, error } = await supabaseClient
                    .from('employees')
                    .select('name, department, section')
                    .eq('emp_code', empCode)
                    .single();

                if (error || !data) {
                    setEmpFieldsError('ไม่พบข้อมูลพนักงานนี้');
                } else {
                    setEmpFields(data);
                }
            } catch (err) {
                console.error('Error fetching employee:', err.message);
                setEmpFieldsError('เกิดข้อผิดพลาดในการค้นหา');
            }
        });

        // 5a. ตรวจสอบขนาดไฟล์รูปทันทีตอนเลือก (ไม่เกิน 5MB)
        function setupImageValidation(inputId, errId) {
            const input = document.getElementById(inputId);
            const errEl = document.getElementById(errId);
            input.addEventListener('change', () => {
                errEl.classList.add('hidden');
                const file = input.files[0];
                if (!file) return;
                if (file.size > MAX_IMAGE_BYTES) {
                    errEl.textContent = `ไฟล์ "${file.name}" ขนาด ${(file.size / 1024 / 1024).toFixed(1)}MB เกิน 5MB กรุณาเลือกไฟล์อื่น`;
                    errEl.classList.remove('hidden');
                    input.value = '';
                }
            });
        }
        setupImageValidation('image_1', 'image_1_err');
        setupImageValidation('image_2', 'image_2_err');

        // 5b. แปลงไฟล์เป็น base64 (ตัด prefix data:...;base64, ออก)
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 5c. อัปโหลดไฟล์ 1 รูปไปยัง Edge Function -> คืนลิงก์ Google Drive
        async function uploadImageToDrive(file) {
            const base64Data = await fileToBase64(file);
            const res = await fetch(UPLOAD_FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'apikey': SUPABASE_ANON_KEY
                },
                body: JSON.stringify({
                    filename: `${Date.now()}_${file.name}`,
                    mimeType: file.type,
                    base64Data
                })
            });
            const result = await res.json();
            if (!res.ok) throw new Error(result.error || 'อัปโหลดรูปไม่สำเร็จ');
            return result.url;
        }

        // 6. ฟังก์ชันส่งเรื่องแจ้งซ่อมผ่าน RPC (อัปโหลดรูปก่อน ถ้ามี)
        async function submitRepairRequest() {
            const empCode = empInput.value.trim();
            const roomId = roomSelect.value;
            const description = document.getElementById('description').value.trim();
            const file1 = document.getElementById('image_1').files[0];
            const file2 = document.getElementById('image_2').files[0];

            if (!empCode || !roomId || !description) {
                showStatus('กรุณากรอกข้อมูลให้ครบถ้วน (รหัสพนักงาน, สถานที่, รายละเอียด)', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            try {
                let imageUrl1 = null;
                let imageUrl2 = null;

                if (file1) {
                    submitBtn.textContent = 'กำลังอัปโหลดรูปที่ 1...';
                    imageUrl1 = await uploadImageToDrive(file1);
                }
                if (file2) {
                    submitBtn.textContent = 'กำลังอัปโหลดรูปที่ 2...';
                    imageUrl2 = await uploadImageToDrive(file2);
                }

                submitBtn.textContent = 'กำลังส่งเรื่อง...';

                const { data, error } = await supabaseClient.rpc('submit_repair_request', {
                    p_emp_code: empCode,
                    p_room_id: roomId,
                    p_description: description,
                    p_image_url_1: imageUrl1,
                    p_image_url_2: imageUrl2
                });

                if (error) throw error;

                showStatus('ส่งเรื่องแจ้งซ่อมสำเร็จ! เลขที่เอกสาร: ' + data, 'success');
                setTimeout(() => location.reload(), 2000);
            } catch (err) {
                console.error('Submit error:', err.message);
                showStatus('เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'ยืนยันการส่งเรื่องแจ้งซ่อม';
            }
        }

        document.getElementById('submitBtn').addEventListener('click', submitRepairRequest);
    </script>

</body>
</html>
