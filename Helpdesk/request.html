<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมอาคารและสถานที่ - Facility Fix</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1a1a1e',
                        cardBorder: '#27272a',
                        primaryRed: '#e53e3e',
                        primaryRedHover: '#fc8181',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col selection:bg-primaryRed selection:text-white">

    <!-- Top Navbar -->
    <header class="border-b border-cardBorder bg-darkBg/85 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primaryRed to-red-800 flex items-center justify-center shadow-lg shadow-red-900/30">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                </div>
                <span class="font-bold text-lg tracking-wide">แจ้งซ่อม<span class="text-primaryRed">อาคารและสถานที่</span></span>
            </div>
        </div>
    </header>

    <!-- Main Container with Sidebar & Content -->
    <div class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">

        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 space-y-2">
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-4 shadow-xl">
                <nav class="space-y-1 text-sm font-medium">
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-primaryRed/10 text-primaryRed font-semibold transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span>แจ้งซ่อม</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        <span>ติดตามสถานะ</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>อนุมัติงาน</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        <span>รายงาน</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900/50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span>จัดการสถานที่</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Form Content -->
        <main class="flex-1">
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-primaryRed/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="mb-8">
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">แบบฟอร์มแจ้งซ่อมอาคารและสถานที่</h1>
                    <p class="text-sm text-zinc-400 mt-1">กรอกข้อมูลรหัสพนักงานและรายละเอียดเพื่อส่งเรื่องไปยังเจ้าหน้าที่ผู้รับผิดชอบ</p>
                </div>

                <!-- Status message box -->
                <div id="statusBox" class="hidden mb-6 rounded-xl px-4 py-3 text-sm"></div>

                <form class="space-y-6">
                    <!-- Employee ID & Auto-fetch Info -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">รหัสพนักงาน</label>
                            <input type="text" id="emp_code" placeholder="เช่น EMP-00124" class="w-full bg-zinc-900/50 border border-cardBorder rounded-xl px-4 py-3 text-sm text-zinc-100 focus:outline-none focus:border-primaryRed transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">ชื่อ-นามสกุล / แผนก</label>
                            <input type="text" id="emp_info" disabled placeholder="แสดงข้อมูลอัตโนมัติ..." class="w-full bg-zinc-950/40 border border-cardBorder/50 rounded-xl px-4 py-3 text-sm text-zinc-500 cursor-not-allowed">
                        </div>
                    </div>

                    <!-- Location Cascading Dropdowns -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">อาคาร</label>
                            <select id="building_select" class="w-full bg-zinc-900/50 border border-cardBorder rounded-xl px-4 py-3 text-sm text-zinc-300 focus:outline-none focus:border-primaryRed transition-colors">
                                <option value="">-- เลือกอาคาร --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">ชั้น</label>
                            <select id="floor_select" disabled class="w-full bg-zinc-900/50 border border-cardBorder rounded-xl px-4 py-3 text-sm text-zinc-300 focus:outline-none focus:border-primaryRed transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                <option value="">-- เลือกอาคารก่อน --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">ห้อง / โซน</label>
                            <select id="room_select" disabled class="w-full bg-zinc-900/50 border border-cardBorder rounded-xl px-4 py-3 text-sm text-zinc-300 focus:outline-none focus:border-primaryRed transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                <option value="">-- เลือกชั้นก่อน --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Problem Description -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">รายละเอียดปัญหา / อาการชำรุด</label>
                        <textarea rows="4" id="description" placeholder="ระบุรายละเอียดหรือจุดที่ต้องการให้ซ่อมแซม..." class="w-full bg-zinc-900/50 border border-cardBorder rounded-xl px-4 py-3 text-sm text-zinc-100 focus:outline-none focus:border-primaryRed transition-colors resize-none"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="button" id="submitBtn" class="w-full bg-primaryRed hover:bg-red-700 text-white font-medium py-3.5 px-4 rounded-xl transition-all duration-200 shadow-lg shadow-red-900/30 active:scale-[0.99] disabled:opacity-50">
                        ยืนยันการส่งเรื่องแจ้งซ่อม
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-zinc-500 border-t border-cardBorder mt-auto">
        &copy; 2026 Facility Fix System. พัฒนาโดย Sarawut.C
    </footer>

    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ตั้งค่าการเชื่อมต่อ Supabase
        const SUPABASE_URL = 'https://fuarmmweqxxhczavkvqp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YXJtbXdlcXh4aGN6YXZrdnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjgzMTcsImV4cCI6MjEwMzgwNDMxN30.n7s4gKOkCvaOSpFSf9FGmWsqi7eAzFe28c_oJWy8NSE'; // <-- ใส่ anon key จริงตรงนี้
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusBox = document.getElementById('statusBox');
        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = 'mb-6 rounded-xl px-4 py-3 text-sm ' +
                (type === 'error'
                    ? 'bg-red-500/10 text-red-400 border border-red-500/30'
                    : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30');
        }

        const buildingSelect = document.getElementById('building_select');
        const floorSelect = document.getElementById('floor_select');
        const roomSelect = document.getElementById('room_select');

        // 1. โหลดรายการอาคารตอนเปิดหน้า
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data, error } = await supabaseClient
                    .from('buildings')
                    .select('*')
                    .order('name', { ascending: true });

                if (error) throw error;

                buildingSelect.innerHTML = '<option value="">-- เลือกอาคาร --</option>';
                (data || []).forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.name;
                    buildingSelect.appendChild(opt);
                });
            } catch (err) {
                console.error('Error loading buildings:', err.message);
                showStatus('โหลดรายการอาคารไม่สำเร็จ: ' + err.message, 'error');
            }
        });

        // 2. เมื่อเลือกอาคาร -> โหลดชั้น
        buildingSelect.addEventListener('change', async () => {
            floorSelect.innerHTML = '<option value="">-- เลือกชั้น --</option>';
            roomSelect.innerHTML = '<option value="">-- เลือกชั้นก่อน --</option>';
            floorSelect.disabled = true;
            roomSelect.disabled = true;

            const buildingId = buildingSelect.value;
            if (!buildingId) return;

            try {
                const { data, error } = await supabaseClient
                    .from('floors')
                    .select('*')
                    .eq('building_id', buildingId)
                    .order('sort_order', { ascending: true });

                if (error) throw error;

                (data || []).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = f.name;
                    floorSelect.appendChild(opt);
                });
                floorSelect.disabled = false;
            } catch (err) {
                console.error('Error loading floors:', err.message);
                showStatus('โหลดรายการชั้นไม่สำเร็จ: ' + err.message, 'error');
            }
        });

        // 3. เมื่อเลือกชั้น -> โหลดห้อง/โซน
        floorSelect.addEventListener('change', async () => {
            roomSelect.innerHTML = '<option value="">-- เลือกห้อง/โซน --</option>';
            roomSelect.disabled = true;

            const floorId = floorSelect.value;
            if (!floorId) return;

            try {
                const { data, error } = await supabaseClient
                    .from('rooms')
                    .select('*')
                    .eq('floor_id', floorId)
                    .order('name', { ascending: true });

                if (error) throw error;

                (data || []).forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.name;
                    roomSelect.appendChild(opt);
                });
                roomSelect.disabled = false;
            } catch (err) {
                console.error('Error loading rooms:', err.message);
                showStatus('โหลดรายการห้อง/โซนไม่สำเร็จ: ' + err.message, 'error');
            }
        });

        // 4. ตรวจสอบรหัสพนักงานอัตโนมัติเมื่อพิมพ์เสร็จ (emp_code)
        const empInput = document.getElementById('emp_code');
        const empInfoInput = document.getElementById('emp_info');

        empInput.addEventListener('blur', async () => {
            const empCode = empInput.value.trim();
            if (!empCode) return;

            try {
                const { data, error } = await supabaseClient
                    .from('employees')
                    .select('name, department')
                    .eq('emp_code', empCode)
                    .single();

                if (error || !data) {
                    empInfoInput.value = 'ไม่พบข้อมูลพนักงานนี้';
                    empInfoInput.classList.add('text-red-400');
                    empInfoInput.classList.remove('text-zinc-200');
                } else {
                    empInfoInput.value = `${data.name} (${data.department})`;
                    empInfoInput.classList.remove('text-red-400');
                    empInfoInput.classList.add('text-zinc-200');
                }
            } catch (err) {
                console.error('Error fetching employee:', err.message);
            }
        });

        // 5. ฟังก์ชันส่งเรื่องแจ้งซ่อมผ่าน RPC
        async function submitRepairRequest() {
            const empCode = empInput.value.trim();
            const roomId = roomSelect.value;
            const description = document.getElementById('description').value.trim();

            if (!empCode || !roomId || !description) {
                showStatus('กรุณากรอกข้อมูลให้ครบถ้วน (รหัสพนักงาน, สถานที่, รายละเอียด)', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งเรื่อง...';

            try {
                const { data, error } = await supabaseClient.rpc('submit_repair_request', {
                    p_emp_code: empCode,
                    p_room_id: roomId,
                    p_description: description
                });

                if (error) throw error;

                showStatus('ส่งเรื่องแจ้งซ่อมสำเร็จ! เลขที่เอกสาร: ' + data, 'success');
                setTimeout(() => location.reload(), 2000);
            } catch (err) {
                console.error('Submit error:', err.message);
                showStatus('เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'ยืนยันการส่งเรื่องแจ้งซ่อม';
            }
        }

        document.getElementById('submitBtn').addEventListener('click', submitRepairRequest);
    </script>

</body>
</html>
