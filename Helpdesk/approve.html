<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>อนุมัติงาน | ระบบแจ้งซ่อมอาคารและสถานที่</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Sarabun', 'Segoe UI', sans-serif; }
  body { background:#f0f9ff; color:#1e293b; display:flex; min-height:100vh; }

  .sidebar {
    width:240px;
    background:linear-gradient(180deg, #0f766e 0%, #115e59 100%);
    color:#fff; display:flex; flex-direction:column;
    position:fixed; height:100vh;
    box-shadow:2px 0 12px rgba(0,0,0,.08);
  }
  .sidebar-header { padding:22px 20px; border-bottom:1px solid rgba(255,255,255,.15); }
  .sidebar-header h2 { font-size:17px; font-weight:700; letter-spacing:.3px; }
  .sidebar-menu { display:flex; flex-direction:column; padding:12px 0; flex:1; }
  .sidebar-menu a {
    padding:12px 20px; color:#ccfbf1; text-decoration:none;
    font-size:14.5px; display:block; margin:2px 10px; border-radius:8px;
    transition:all .2s ease;
  }
  .sidebar-menu a:hover { background:rgba(255,255,255,.12); color:#fff; transform:translateX(2px); }
  .sidebar-menu a.active { background:#14b8a6; color:#fff; font-weight:600; box-shadow:0 4px 10px rgba(20,184,166,.35); }

  .content { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .page-body { flex:1; padding:30px; }
  h1 { font-size:24px; color:#0f766e; font-weight:700; }

  .card {
    background:#fff; border-radius:14px; padding:22px;
    box-shadow:0 4px 16px rgba(15,118,110,.06);
    border:1px solid #e0f2f1; margin-bottom:20px;
  }

  .btn {
    padding:7px 14px; border:none; border-radius:8px;
    cursor:pointer; font-size:13px; font-weight:600;
    transition:all .2s ease;
  }
  .btn:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.12); }
  .btn-success { background:#10b981; color:#fff; }
  .btn-success:hover { background:#059669; }
  .btn-danger { background:#ef4444; color:#fff; }
  .btn-danger:hover { background:#dc2626; }

  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { padding:12px 10px; border-bottom:1px solid #e0f2f1; text-align:left; font-size:14px; }
  th { background:#ccfbf1; color:#0f766e; font-weight:700; font-size:13px; }
  tr:hover td { background:#f0fdfa; }

  .app-footer {
    text-align:center; padding:16px; font-size:13px;
    color:#64748b; border-top:1px solid #e0f2f1; background:#fff;
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2>🛠️ ระบบแจ้งซ่อม</h2></div>
    <nav class="sidebar-menu">
      <a href="request.html">📋 แจ้งซ่อม / ติดตาม</a>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="approve.html" class="active">✅ อนุมัติงาน</a>
      <a href="reports.html">📈 รายงาน</a>
      <a href="locations.html">🏢 จัดการสถานที่</a>
      <a href="#" onclick="logout()">🚪 ออกจากระบบ</a>
    </nav>
  </aside>
  <div class="content">
    <div class="page-body">
      <h1>รายการรออนุมัติ</h1>
      <div class="card" style="margin-top:20px;">
        <table>
          <thead><tr><th>เลขที่เอกสาร</th><th>ผู้แจ้ง</th><th>แผนก</th><th>สถานที่</th><th>รายละเอียด</th><th>วันที่แจ้ง</th><th>จัดการ</th></tr></thead>
          <tbody id="pendingList"></tbody>
        </table>
      </div>
    </div>
    <footer class="app-footer">ระบบแจ้งซ่อมอาคารและสถานที่ | พัฒนาโดย Sarawut.C</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fuarmmweqxxhczavkvqp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YXJtbXdlcXh4aGN6YXZrdnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjgzMTcsImV4cCI6MjEwMzgwNDMxN30.n7s4gKOkCvaOSpFSf9FGmWsqi7eAzFe28c_oJWy8NSE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let sessionUser = null;
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      sessionUser = session;
      loadPending();
    }
    checkAuth();

    async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }

    async function loadPending() {
      const { data } = await supabaseClient.from('repair_requests')
        .select(`id, document_no, reporter_name, reporter_section, description, created_at, repair_locations ( building, floor, room )`)
        .eq('status', 'pending').order('created_at', { ascending: true });

      const tbody = document.getElementById('pendingList');
      tbody.innerHTML = '';
      if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#94a3b8;">ไม่มีรายการรออนุมัติ</td></tr>'; return; }

      data.forEach(i => {
        const loc = i.repair_locations ? `${i.repair_locations.building} ชั้น ${i.repair_locations.floor} ห้อง ${i.repair_locations.room}` : '-';
        tbody.innerHTML += `<tr>
          <td>${i.document_no}</td><td>${i.reporter_name}</td><td>${i.reporter_section}</td><td>${loc}</td><td>${i.description}</td><td>${new Date(i.created_at).toLocaleString('th-TH')}</td>
          <td>
            <button class="btn btn-success" onclick="updateStatus('${i.id}', 'approved')">อนุมัติ</button>
            <button class="btn btn-danger" onclick="updateStatus('${i.id}', 'rejected')">ปฏิเสธ</button>
          </td></tr>`;
      });
    }

    async function updateStatus(id, status) {
      let updateData = { status: status, approved_by: sessionUser.user.id, approved_at: new Date().toISOString() };
      if(status === 'rejected') {
        const reason = prompt('ระบุเหตุผลที่ปฏิเสธ:');
        if(reason === null) return;
        updateData.reject_reason = reason;
      }
      const { error } = await supabaseClient.from('repair_requests').update(updateData).eq('id', id);
      if(error) { alert('Error: ' + error.message); return; }
      loadPending();
    }
  </script>
</body>
</html>
